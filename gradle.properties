org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official
android.experimental.enableScreenshotTest=true
# Rendering every screen in every store locale runs in one JVM and the renderer's heap use adds up
# over the run. The screenshot plugin reads this property and applies it to its own update/validate
# tasks only, so ordinary unit tests keep their default heap.
android.compose.screenshot.maxHeapSize=6g
